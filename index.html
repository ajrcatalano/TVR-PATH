<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TVR PATH – Personalized Approach to Traditional Holistics</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-outer:   #6b1a10;
    --bg-inner:   #c85a20;
    --bg-glow:    #e8832a;
    --wood-fill:  #d4a96a;
    --wood-ring:  #b8894a;
    --wood-dark:  #8b6030;
    --text-node:  #2a1a08;
    --text-title: #0a0000;
    --focus-ring: #ffe066;
  }

  body {
    font-family: Georgia, 'Times New Roman', serif;
    background: radial-gradient(ellipse at center, var(--bg-glow) 0%, var(--bg-inner) 35%, var(--bg-outer) 100%);
    min-height: 100vh;
    color: var(--text-title);
  }

  .skip-link {
    position: absolute; top: -9999px; left: 1rem;
    background: #fff; color: #000;
    padding: 0.5rem 1rem; font-size: 1rem;
    border-radius: 4px; z-index: 9999;
    text-decoration: none; font-family: Arial, sans-serif;
  }
  .skip-link:focus { top: 1rem; }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  .page-wrapper {
    max-width: 1100px;
    margin: 0 auto;
    padding: 2.5rem 1.5rem 3rem;
  }

  .page-heading {
    text-align: center;
    margin-bottom: 2rem;
    background: rgba(0, 0, 0, 0.62);
    border-radius: 10px;
    padding: 1rem 1.5rem;
    border: 1px solid rgba(255, 200, 80, 0.25);
  }
  .page-heading h1 {
    font-size: clamp(1.6rem, 4vw, 2.4rem);
    font-weight: 700; color: #ffffff;
    letter-spacing: 0.05em;
  }
  .page-heading p {
    font-size: clamp(1rem, 2.5vw, 1.3rem);
    font-weight: 700; color: #ffffff;
    margin-top: 0.3rem;
  }

  .circle-container {
    position: relative;
    width: 100%;
    padding-bottom: 100%;
    max-width: 900px;
    margin: 0 auto;
  }

  /* ── Centre panel ── */
  .centre {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    width: 42%;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* Selected node preview above flame */

  .flame-wrap {
    width: clamp(108px, 21.6%, 186px);
    height: clamp(108px, 21.6%, 186px);
    background: radial-gradient(circle at 50% 70%, #1a0800 0%, #0a0400 60%, #050200 100%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    border: 3px solid #5a3010;
    box-shadow: 0 0 18px 4px rgba(255,120,20,0.18), inset 0 0 12px rgba(255,80,0,0.08);
    flex-shrink: 0;
  }
  .flame-wrap svg { width: 88%; height: 88%; }

  /* Definition text below flame */
  #centre-def {
    opacity: 0;
    transition: opacity 0.4s ease 0.15s;
    max-height: 0;
    overflow: hidden;
    transition: opacity 0.4s ease 0.15s, max-height 0.4s ease 0.1s;
    width: 100%;
    margin-top: 6px;
  }
  #centre-def.visible {
    opacity: 1;
    max-height: 400px;
  }
  #centre-def {
    background: rgba(255, 245, 220, 0.82);
    border-radius: 8px;
    padding: 5px 7px;
    backdrop-filter: blur(2px);
  }
  #centre-def-title {
    font-family: Georgia, serif;
    font-size: clamp(0.6rem, 1.3vw, 0.85rem);
    font-weight: 700;
    color: #1a0800;
    line-height: 1.3;
    margin-bottom: 4px;
  }
  #centre-def-body {
    font-family: Arial, Helvetica, sans-serif;
    font-size: clamp(0.48rem, 0.95vw, 0.68rem);
    color: #1a0800;
    line-height: 1.5;
    max-height: clamp(80px, 16vw, 160px);
    overflow-y: auto;
    padding-right: 2px;
    scrollbar-width: thin;
    scrollbar-color: rgba(120,70,20,0.5) rgba(200,160,80,0.2);
    text-align: left;
  }

  /* Reset button */
  #reset-btn {
    display: none;
    margin-top: 5px;
    background: rgba(40,15,0,0.88);
    color: #ffe8a0;
    border: 1px solid rgba(255,200,80,0.7);
    border-radius: 20px;
    padding: 6px 14px; min-height: 44px; min-width: 44px;
    font-size: clamp(0.45rem, 0.9vw, 0.65rem);
    font-family: Arial, sans-serif;
    cursor: pointer;
    transition: background 0.2s;
    flex-shrink: 0;
  }
  #reset-btn:hover { background: rgba(20,8,0,0.95); color: #fff5c0; }
  #reset-btn:focus { outline: 2px solid var(--focus-ring); outline-offset: 2px; }
  #reset-btn.visible { display: block; }

  /* ── Nodes ── */
  .node {
    position: absolute;
    width: clamp(68px, 9.5vw, 108px);
    height: clamp(68px, 9.5vw, 108px);
    transform: translate(-50%, -50%) scale(1);
    transform-origin: center center;
    z-index: 3;
    overflow: visible;
    transition: transform 0.2s cubic-bezier(0.34,1.56,0.64,1), opacity 0.35s ease;
  }
  .node:hover, .node:focus-within {
    transform: translate(-50%, -50%) scale(1.35);
    z-index: 10;
  }
  .node.faded {
    opacity: 0;
    pointer-events: none;
  }
  .node.selected {
    transform: translate(-50%, -50%) scale(1.15);
    z-index: 11;
  }
  .node svg { width: 100%; height: 100%; overflow: visible; }
  .node-btn { cursor: pointer; }
  .node-btn:focus { outline: none; }
  .node-btn:focus .node-ring { stroke: var(--focus-ring); stroke-width: 4; }
  .node-label {
    font-family: Arial, Helvetica, sans-serif;
    font-weight: 700;
    fill: #2a1a08;
    text-anchor: middle;
    dominant-baseline: middle;
  }

  /* ── Fallback list ── */
  #node-list {
    margin-top: 2rem;
    padding: 1.2rem 1.5rem;
    background: rgba(0,0,0,0.55);
    border-radius: 8px;
    border: 1px solid rgba(255,210,120,0.5);
  }
  #node-list h2 {
    font-size: 1rem; color: #ffe8a0;
    margin-bottom: 0.75rem; font-family: Arial, sans-serif;
  }
  #node-list ul {
    list-style: none;
    padding-left: 0;
    column-count: 2; column-gap: 1.5rem;
  }
  #node-list li {
    font-family: Arial, sans-serif;
    font-size: 0.9rem; color: #fff3cc;
    margin-bottom: 0.35rem; break-inside: avoid;
  }
  #node-list details summary { cursor: pointer; font-weight: 700; color: #ffe8a0; padding: 0.25rem 0; min-height: 44px; display: flex; align-items: center; }
  #node-list details p { color: #f5e8c0; }
  #node-list li {
    transition: opacity 0.3s ease, max-height 0.35s ease;
  }
  #node-list li.list-hidden {
    display: none;
  }

  .hint {
    text-align: center; font-family: Arial, sans-serif;
    font-size: 0.82rem; color: #0a0000; font-weight: 700; text-shadow: 0 1px 2px rgba(255,220,140,0.4);
    margin-top: 0.6rem; letter-spacing: 0.02em;
  }

  /* ── Circle scroll wrapper (mobile) ── */
  .circle-scroll-wrap {
    width: 100%;
    overflow-x: auto;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-x pan-y;
  }
  .circle-scroll-wrap .circle-container {
    /* On small screens enforce a minimum size so the diagram stays usable */
    min-width: 340px;
    min-height: 340px;
  }

  /* ── Tablet: single column list, tighter padding ── */
  @media (max-width: 768px) {
    #node-list ul { column-count: 1; }
    .page-wrapper { padding: 1.5rem 1rem 2rem; }
    #node-list h2 { font-size: 1.1rem; }
    #node-list li { font-size: 1rem; margin-bottom: 0.6rem; }
    #node-list details summary { font-size: 1rem; }
    #node-list details p { font-size: 0.95rem; line-height: 1.6; }
  }

  /* ── Phone: keep circle, tighten layout ── */
  @media (max-width: 600px) {
    .mobile-hint { display: block !important; }
    .hint { display: none; }
    .page-wrapper { padding: 1rem 0.5rem 1.5rem; }
    .page-heading { padding: 0.75rem 1rem; }
    /* Limit circle height on phones so it doesn't dominate scroll */
    .circle-scroll-wrap {
      max-height: 92vw;
    }
  }

  /* ── Touch devices: larger tap targets, reduce hover zoom ── */
  @media (hover: none) {
    .node {
      width: clamp(60px, 12vw, 108px);
      height: clamp(60px, 12vw, 108px);
    }
    .node:hover, .node:focus-within {
      transform: translate(-50%, -50%) scale(1.22);
    }
    #reset-btn {
      padding: 8px 18px;
      font-size: clamp(0.6rem, 1.1vw, 0.8rem);
    }
  }
</style>
</head>

<main id="main-content">
  <div class="page-wrapper">

  /* Canvas text measurement */
  var canvas = document.createElement('canvas');
  var ctx = canvas.getContext('2d');
  function measureWidth(text, fs) {
    ctx.font = 'bold ' + fs + 'px Arial,Helvetica,sans-serif';
    return ctx.measureText(text).width;
  }
  function wrapWords(label, maxW, fs) {
    var words = label.split(' '), lines = [], cur = '';
    words.forEach(function(w) {
      var test = cur ? cur + ' ' + w : w;
      if (measureWidth(test, fs) <= maxW) { cur = test; }
      else { if (cur) lines.push(cur); cur = w; }
    });
    if (cur) lines.push(cur);
    return lines;
  }
  function fitTextInCircle(label, r) {
    var pad = 0.78, lineH, lines, totalH, fits;
    for (var fs = 13; fs >= 6; fs--) {
      lineH = fs * 1.25;
      lines = wrapWords(label, r * 2 * pad, fs);
      totalH = lines.length * lineH;
      fits = true;
      var startY = -totalH / 2 + lineH / 2;
      for (var li = 0; li < lines.length; li++) {
        var y = startY + li * lineH;
        var chord = 2 * Math.sqrt(Math.max(0, r*r - y*y)) * pad;
        if (measureWidth(lines[li], fs) > chord) { fits = false; break; }
      }
      if (fits && totalH <= r * 2 * pad) break;
    }
    return { lines: lines, fontSize: fs, lineH: lineH };
  }

  /* Build one wood-log SVG (reused for orbit nodes and centre preview) */
  function buildLogSVG(label, gradId, nodeRadius) {
    var svg = document.createElementNS(NS, 'svg');
    svg.setAttribute('viewBox', '-56 -56 112 112');
    svg.setAttribute('role', 'none');
    svg.setAttribute('aria-hidden', 'true');
    var defs = document.createElementNS(NS, 'defs');
    var grad = document.createElementNS(NS, 'radialGradient');
    grad.setAttribute('id', gradId);
    grad.setAttribute('cx','38%'); grad.setAttribute('cy','38%'); grad.setAttribute('r','62%');
    [['0%','#e8c888'],['45%','#d4a96a'],['72%','#b8894a'],['100%','#7a5028']].forEach(function(s){
      var stop = document.createElementNS(NS,'stop');
      stop.setAttribute('offset',s[0]); stop.setAttribute('stop-color',s[1]);
      grad.appendChild(stop);
    });
    defs.appendChild(grad); svg.appendChild(defs);
    var g = document.createElementNS(NS,'g');
    var circ = document.createElementNS(NS,'circle');
    circ.setAttribute('class','node-circle'); circ.setAttribute('r','50');
    circ.setAttribute('fill','url(#'+gradId+')');
    circ.setAttribute('stroke','#7a5028'); circ.setAttribute('stroke-width','2.5');
    g.appendChild(circ);
    [16,28,38].forEach(function(rr){
      var ring = document.createElementNS(NS,'circle');
      ring.setAttribute('r',String(rr)); ring.setAttribute('fill','none');
      ring.setAttribute('stroke','rgba(140,90,30,0.22)'); ring.setAttribute('stroke-width','1.5');
      g.appendChild(ring);
    });
    var focusRing = document.createElementNS(NS,'circle');
    focusRing.setAttribute('class','node-ring'); focusRing.setAttribute('r','53');
    focusRing.setAttribute('fill','none'); focusRing.setAttribute('stroke','transparent');
    focusRing.setAttribute('stroke-width','0');
    g.appendChild(focusRing);
    var fit = fitTextInCircle(label, nodeRadius || 42);
    var startY = -(fit.lines.length-1)*fit.lineH/2;
    fit.lines.forEach(function(line,li){
      var t = document.createElementNS(NS,'text');
      t.setAttribute('class','node-label'); t.setAttribute('x','0');
      t.setAttribute('y', String(startY + li*fit.lineH));
      t.setAttribute('font-size', String(fit.fontSize));
      t.textContent = line;
      g.appendChild(t);
    });
    svg.appendChild(g);
    return { svg: svg, g: g };
  }

  /* Build orbit nodes */
  topicData.forEach(function(topic, i) {
    var angle = (i / n) * 2 * Math.PI - Math.PI / 2;

    var wrap = document.createElement('div');
    wrap.className = 'node';
    wrap.style.left = cx + '%';
    wrap.style.top  = cy + '%';
    wrap.dataset.index = i;

    var built = buildLogSVG(topic.label, 'wg'+i, 42);
    built.g.setAttribute('tabindex','0');

    built.g.addEventListener('click', function() { selectNode(i); });

    /* Show definition on hover only when no node is clicked */

      if (activeIndex === -1) { previewNode(i); }

      if (activeIndex === -1) {
        e.stopPropagation();
        previewNode(i);
      }

    wrap.appendChild(built.svg);
    circleEl.appendChild(wrap);
    nodeEls.push({ wrap: wrap, g: built.g });
  });

  function normalizeLabel(s) {
    return s.toLowerCase().replace(/[^a-z0-9]/g,'');
  }

  var hoverTimeout = null;
  function previewNode(i) {
    clearTimeout(hoverTimeout);

    defBody.textContent  = topic.def;
    centreDefEl.classList.add('visible');
  }
  function clearPreview() {
    hoverTimeout = setTimeout(function() {
      if (activeIndex === -1) {
        centreDefEl.classList.remove('visible');
        setTimeout(function() {
          if (activeIndex === -1) {
            defTitle.textContent = '';
            defBody.textContent  = '';
          }
        }, 350);
      }
    }, 120);
  }

  function selectNode(i) {
    activeIndex = i;
    var topic = topicData[i];

    /* Normalised related set */
    var relatedNorm = {};
    topic.related.forEach(function(r){ relatedNorm[normalizeLabel(r)] = true; });

    /* Fade unrelated nodes; highlight selected */
    nodeEls.forEach(function(el, j) {
      var jLabel = normalizeLabel(topicData[j].label);
      el.wrap.classList.remove('faded','selected');
      if (j === i) {
        el.wrap.classList.add('selected');
      } else if (!relatedNorm[jLabel]) {
        el.wrap.classList.add('faded');
      }
    });

    /* Definition */
    defTitle.textContent = topic.label;
    defBody.textContent  = topic.def;
    centreDefEl.classList.add('visible');

    /* Filter list */
    filterList(relatedNorm, i);

    /* Reset button */
    resetBtn.classList.add('visible');

    /* Live region update for screen readers */
    announce(topic.label + ': ' + topic.def);
  }

  function resetAll() {
    activeIndex = -1;
    nodeEls.forEach(function(el) {
      el.wrap.classList.remove('faded','selected');

    centreDefEl.classList.remove('visible');
    resetBtn.classList.remove('visible');
    resetList();
    setTimeout(function(){
      defTitle.textContent = '';
      defBody.textContent  = '';
    }, 400);
  }

    var p = document.createElement('p');
    p.textContent = item.def;
    p.style.cssText = 'margin-top:0.4rem;font-size:0.85rem;color:#f0d090;line-height:1.5;';
    details.appendChild(summary); details.appendChild(p);
    li.appendChild(details); ul.appendChild(li);
    listItems.push(li);
    listDetails.push(details);
  });

  function filterList(relatedNorm, selectedIndex) {
    listItems.forEach(function(li, j) {
      var jLabel = normalizeLabel(topicData[j].label);
      if (j === selectedIndex || relatedNorm[jLabel]) {
        li.classList.remove('list-hidden');
        listDetails[j].setAttribute('open', ''); /* expand all visible items */
      } else {
        li.classList.add('list-hidden');
        listDetails[j].removeAttribute('open');
      }
    });
  }

  function resetList() {
    listItems.forEach(function(li, j) {
      li.classList.remove('list-hidden');
      listDetails[j].removeAttribute('open'); /* collapse all on reset */
    });
  }

})();
</script>
</body>
</html>
